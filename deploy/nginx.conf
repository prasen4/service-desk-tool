# Reverse proxy for the Tech Desk API.
# Place at /etc/nginx/sites-available/techdesk and symlink into sites-enabled.
#
# The app has no built-in authentication, so it must not be exposed directly.
# This proxy terminates TLS and (optionally) enforces HTTP basic auth. Lock the
# EC2 security group down to trusted CIDRs as well.

server {
    listen 80;
    server_name techdesk.example.com;

    # Redirect all traffic to HTTPS once certificates are installed.
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # pipeline runs can be long-lived

        # Optional basic auth — create the file with:
        #   sudo htpasswd -c /etc/nginx/.htpasswd techdesk
        # auth_basic           "Tech Desk";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Let the load balancer / uptime checks hit the health endpoint unauthenticated.
    location = /api/health {
        proxy_pass http://127.0.0.1:8080/api/health;
    }
}

# HTTPS server block (enable after obtaining certificates, e.g. with certbot):
#
# server {
#     listen 443 ssl http2;
#     server_name techdesk.example.com;
